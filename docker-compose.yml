services:
    postgres:
        image: postgres:18-alpine
        container_name: portfolio_postgres
        restart: always
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10

    nginx:
        restart: always
        volumes:
            - nginx_cache:/var/lib/nginx/proxy_cache
            - static:/app/www/static/
            - local_static:/var/www/local_static/
            - nuxt:/var/www/nuxt:ro
            - static:/var/www/static/:ro
            - acme.sh:/acme.sh:delegated
            - certs:/etc/nginx/certs
        build:
            context: ./nginx
        ports:
            - 80:80
            - 443:443
        # nginx нужны только эти две переменные, остальные секреты ему ни к чему
        environment:
            - SITE_HOST=${SITE_HOST}
            - TLS_MODE=${TLS_MODE}

    migrate:
        build:
            context: ./front
            target: migrate
        environment:
            - DATABASE_URL=${DATABASE_URL}
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy

    frontend:
        restart: always
        build:
            context: ./front
            target: runtime
        env_file:
            - .env
        environment:
            - DATABASE_URL=${DATABASE_URL}
        volumes:
            - nuxt:/app/nuxt_volume:delegated
            - uploads:/app/storage/uploads
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

volumes:
    nginx_cache:
    local_static:
    static:
    nuxt:
    acme.sh:
    certs:
    postgres_data:
    uploads:
